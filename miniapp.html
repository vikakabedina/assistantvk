<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Абонементы</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  /* палитра с фотографий: кремово-бежевый + бирюзовый акцент */
  --cream:#E4E1D7;
  --bg:#E4E1D7;
  --card:#F3F1E8;
  --card-solid:#FBFAF5;
  --teal:#77C6C7;
  --teal-dark:#4E9FA0;
  --text:#2E2E29;
  --hint:#8B897C;
  --line:rgba(46,46,41,.12);
  --soft:rgba(119,198,199,.16);
  --ok:#6FA88A;
  --warn:#C9962E;
  --bad:#B8573F;
  --accent-text:#20302F;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0; padding:0; background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  font-size:15px; line-height:1.4;}
body{padding-bottom:24px;}
.wrap{max-width:520px; margin:0 auto; padding:16px;}
h1{font-size:20px; margin:4px 0 2px;}
h2{font-size:16px; margin:18px 0 8px; color:var(--text);}
.hint{color:var(--hint); font-size:13px;}

.card{background:var(--card); border:1px solid var(--line); border-radius:16px;
  padding:16px; margin-bottom:12px;}
.card.solid{background:var(--card-solid);}

.balance-card{border-radius:18px; padding:20px; margin:12px 0; color:var(--accent-text);}
.balance-card.ok{background:linear-gradient(135deg,#BFE3D8,#9FD0C6);}
.balance-card.warn{background:linear-gradient(135deg,#F3DFA0,#EBC873);}
.balance-card.bad{background:linear-gradient(135deg,#E9BDB0,#DE9A87);}
.balance-num{font-size:34px; font-weight:700; margin:4px 0;}
.balance-label{font-size:13px; opacity:.75;}

.row{display:flex; align-items:center; justify-content:space-between; gap:10px;}
.row + .row{margin-top:8px;}

button, .btn{
  font-family:inherit; font-size:15px; font-weight:600;
  border:none; border-radius:12px; padding:12px 16px;
  background:var(--teal); color:#1B2B2A; cursor:pointer;
  width:100%; text-align:center;
}
button:active{background:var(--teal-dark);}
button.secondary{background:var(--card-solid); color:var(--text); border:1px solid var(--line);}
button.danger{background:var(--bad); color:#fff;}
button.small{width:auto; padding:8px 12px; font-size:13px; border-radius:10px;}
button:disabled{opacity:.5; cursor:default;}

input[type=text], input[type=number]{
  width:100%; font-size:15px; font-family:inherit; color:var(--text);
  background:var(--card-solid); border:1px solid var(--line); border-radius:10px;
  padding:10px 12px; margin:6px 0;
}

.tabs{display:flex; gap:6px; overflow-x:auto; margin:14px 0; padding-bottom:4px;}
.tab{flex:none; padding:8px 14px; border-radius:999px; background:var(--card);
  border:1px solid var(--line); color:var(--hint); font-size:13px; font-weight:600; cursor:pointer;}
.tab.active{background:var(--teal); color:var(--accent-text); border-color:transparent;}

.student-row{display:flex; justify-content:space-between; align-items:center;
  padding:12px 0; border-bottom:1px solid var(--line); cursor:pointer;}
.student-row:last-child{border-bottom:none;}
.student-name{font-weight:600;}
.student-sub{font-size:12px; color:var(--hint);}
.badge{font-size:11px; padding:2px 8px; border-radius:999px; font-weight:700;}
.badge.ok{background:var(--soft); color:var(--teal-dark);}
.badge.warn{background:#F3DFA0; color:#7A5A0E;}
.badge.bad{background:#EAC3B7; color:#8A3A24;}
.badge.paused{background:var(--line); color:var(--hint);}

.overlay{position:fixed; inset:0; background:rgba(46,46,41,.35);
  display:flex; align-items:flex-end; justify-content:center; z-index:50;}
.sheet{background:var(--bg); width:100%; max-width:520px; border-radius:20px 20px 0 0;
  padding:20px; max-height:85vh; overflow-y:auto;}
.sheet-close{width:36px; height:4px; background:var(--line); border-radius:99px; margin:0 auto 14px;}

.spinner{width:28px; height:28px; border-radius:50%; border:3px solid var(--line);
  border-top-color:var(--teal); animation:spin .8s linear infinite; margin:60px auto;}
@keyframes spin{to{transform:rotate(360deg);}}

.toast{position:fixed; left:50%; bottom:24px; transform:translateX(-50%);
  background:var(--text); color:var(--bg); padding:10px 18px; border-radius:99px;
  font-size:13px; z-index:100; opacity:0; transition:opacity .25s;}
.toast.show{opacity:1;}
</style>
</head>
<body>

<div class="wrap" id="app">
  <div class="spinner"></div>
</div>
<div class="toast" id="toast"></div>

<script>
const tg = window.Telegram?.WebApp;
if (tg){ tg.ready(); tg.expand(); }
const initData = tg?.initData || "";

const app = document.getElementById("app");
const toastEl = document.getElementById("toast");

function toast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add("show");
  setTimeout(()=>toastEl.classList.remove("show"), 2200);
}

async function api(path, opts={}){
  const headers = Object.assign({"X-Telegram-Init-Data": initData}, opts.headers||{});
  if (opts.body) headers["Content-Type"] = "application/json";
  const res = await fetch(path, Object.assign({}, opts, {headers}));
  let data = {};
  try { data = await res.json(); } catch(e){}
  if (!res.ok) throw new Error(data.error || ("HTTP " + res.status));
  return data;
}

function wordLessons(n){
  const a = Math.abs(n);
  if (a % 100 >= 11 && a % 100 <= 14) return "уроков";
  const d = a % 10;
  if (d === 1) return "урок";
  if (d >= 2 && d <= 4) return "урока";
  return "уроков";
}

function balanceClass(balance){
  if (balance > 1) return "ok";
  if (balance === 0 || balance === 1) return "warn";
  return "bad";
}
function badgeClass(balance){
  if (balance > 1) return "ok";
  if (balance === 0 || balance === 1) return "warn";
  return "bad";
}

// ================= СТУДЕНТ =================
function renderStudent(me){
  const bcls = balanceClass(me.balance ?? 0);
  const priceLine = me.price != null ? `${me.price}₽ / урок` : "цена ещё не задана";

  let pendingBlock = "";
  if (me.pending_lessons){
    const amount = me.pending_lessons * (me.price || 0);
    pendingBlock = `
      <div class="card">
        <div class="hint">К оплате</div>
        <div style="font-weight:700; font-size:17px; margin:4px 0;">
          ${me.pending_lessons} ${wordLessons(me.pending_lessons)} — ${amount}₽
        </div>
        <div class="hint">Карта: <b style="color:var(--text)">${me.card_number}</b></div>
      </div>`;
  }

  let confirmBadge = "";
  if (me.awaiting_confirmation){
    confirmBadge = `<div class="hint" style="margin-top:6px;">⏳ Ждём подтверждения Виктории</div>`;
  }

  app.innerHTML = `
    <h1>Привет, ${me.name}! 👋</h1>
    <div class="hint">${me.group_label || "Индивидуальные занятия"}</div>

    <div class="balance-card ${bcls}">
      <div class="balance-label">Баланс уроков</div>
      <div class="balance-num">${me.price != null ? (me.balance ?? 0) : "—"} ${me.price != null ? wordLessons(me.balance ?? 0) : ""}</div>
      <div class="balance-label">${priceLine}</div>
    </div>

    ${pendingBlock}
    ${confirmBadge}

    <button id="btnPaid" ${!me.price ? "disabled" : ""}>Я оплатил(а)</button>
  `;

  document.getElementById("btnPaid")?.addEventListener("click", async ()=>{
    try{
      await api("/api/paid", {method:"POST"});
      toast("Спасибо! Отправили Виктории на подтверждение 🙌");
      load();
    }catch(e){ toast("Не получилось: " + e.message); }
  });
}

function renderNotSetup(me){
  app.innerHTML = `
    <h1>Привет, ${me.name}! 👋</h1>
    <div class="card">Виктория скоро настроит твой абонемент — загляни чуть позже 🤓</div>
  `;
}

function renderNotRegistered(){
  app.innerHTML = `
    <h1>Привет!</h1>
    <div class="card">Похоже, ты ещё не зарегистрирован(а). Напиши боту /start в чате, чтобы зарегистрироваться, потом возвращайся сюда.</div>
  `;
}

// ================= АДМИН (ВИКТОРИЯ) =================
let adminData = { students: [], groups: {} };
let activeTab = "students";

function priceStr(s){ return s.price != null ? `${s.price}₽` : "—"; }
function balStr(s){ return s.balance != null ? `${s.balance} ${wordLessons(s.balance)}` : "—"; }
function modeLabel(s, groups){ return s.mode === "individual" ? "Индивидуально" : (groups[s.group] || s.group || "?"); }

async function loadAdminData(){
  const data = await api("/api/students");
  adminData = data;
}

function renderAdmin(){
  const active = adminData.students.filter(s=>s.active);
  const inactive = adminData.students.filter(s=>!s.active);
  const awaiting = active.filter(s=>s.awaiting_confirmation);

  app.innerHTML = `
    <h1>Панель Виктории</h1>
    <div class="tabs">
      <div class="tab ${activeTab==='students'?'active':''}" data-tab="students">👥 Ученики</div>
      <div class="tab ${activeTab==='lesson'?'active':''}" data-tab="lesson">📚 Урок</div>
      <div class="tab ${activeTab==='remind'?'active':''}" data-tab="remind">🔔 Напомнить</div>
      <div class="tab ${activeTab==='confirm'?'active':''}" data-tab="confirm">✅ Подтвердить${awaiting.length?` (${awaiting.length})`:''}</div>
      <div class="tab ${activeTab==='removed'?'active':''}" data-tab="removed">🗄 Удалённые</div>
    </div>
    <div id="tabBody"></div>
  `;
  document.querySelectorAll(".tab").forEach(t=>{
    t.addEventListener("click", ()=>{ activeTab = t.dataset.tab; renderAdmin(); });
  });

  const body = document.getElementById("tabBody");
  if (activeTab === "students") renderStudentsTab(body, active);
  else if (activeTab === "lesson") renderLessonTab(body, active);
  else if (activeTab === "remind") renderRemindTab(body, active);
  else if (activeTab === "confirm") renderConfirmTab(body, awaiting);
  else if (activeTab === "removed") renderRemovedTab(body, inactive);
}

function renderStudentsTab(body, active){
  if (!active.length){ body.innerHTML = `<div class="card">Учеников пока нет.</div>`; return; }
  body.innerHTML = `<div class="card solid">` + active.map(s=>`
    <div class="student-row" data-uid="${s.id}">
      <div>
        <div class="student-name">${s.name} ${s.paused?'⏸':''}</div>
        <div class="student-sub">${modeLabel(s, adminData.groups)} · цена ${priceStr(s)}</div>
      </div>
      <div class="badge ${badgeClass(s.balance ?? 0)}">${balStr(s)}</div>
    </div>
  `).join("") + `</div>`;

  body.querySelectorAll(".student-row").forEach(row=>{
    row.addEventListener("click", ()=> openStudentSheet(row.dataset.uid));
  });
}

function openStudentSheet(uid){
  const s = adminData.students.find(x=>x.id===uid);
  if (!s) return;
  const overlay = document.createElement("div");
  overlay.className = "overlay";
  overlay.innerHTML = `
    <div class="sheet">
      <div class="sheet-close"></div>
      <h2 style="margin-top:0">${s.name}</h2>
      <div class="hint">${modeLabel(s, adminData.groups)}</div>

      <div class="card" style="margin-top:12px;">
        <div class="hint">Цена урока (₽)</div>
        <input type="number" id="priceInput" value="${s.price ?? ''}" placeholder="например 3000">
        <div class="hint">Баланс уроков (может быть отрицательным)</div>
        <input type="number" id="balanceInput" value="${s.balance ?? ''}" placeholder="например 0 или -1">
        <button id="btnSave" style="margin-top:8px;">💾 Сохранить</button>
      </div>

      <div class="row" style="margin-top:14px;">
        <button class="secondary" id="btnPause">${s.paused ? "▶️ Снять с паузы" : "⏸ Поставить на паузу"}</button>
      </div>
      <div class="row" style="margin-top:8px;">
        <button class="danger" id="btnRemove">🗑 Удалить ученика</button>
      </div>
      <div class="row" style="margin-top:14px;">
        <button class="secondary" id="btnClose">Закрыть</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  overlay.addEventListener("click", (e)=>{ if (e.target === overlay) overlay.remove(); });
  overlay.querySelector("#btnClose").addEventListener("click", ()=>overlay.remove());

  overlay.querySelector("#btnSave").addEventListener("click", async ()=>{
    const price = overlay.querySelector("#priceInput").value;
    const balance = overlay.querySelector("#balanceInput").value;
    try{
      await api("/api/setup", {method:"POST", body: JSON.stringify({
        uid, price: price!=="" ? parseInt(price,10) : null, balance: balance!=="" ? parseInt(balance,10) : null
      })});
      toast("Сохранено ✅");
      overlay.remove();
      await refreshAdmin();
    }catch(e){ toast("Ошибка: " + e.message); }
  });

  overlay.querySelector("#btnPause").addEventListener("click", async ()=>{
    try{
      await api("/api/manage", {method:"POST", body: JSON.stringify({uid, action:"toggle_pause"})});
      overlay.remove();
      await refreshAdmin();
    }catch(e){ toast("Ошибка: " + e.message); }
  });

  overlay.querySelector("#btnRemove").addEventListener("click", async ()=>{
    if (!confirm(`Удалить ${s.name}?`)) return;
    try{
      await api("/api/manage", {method:"POST", body: JSON.stringify({uid, action:"remove"})});
      overlay.remove();
      await refreshAdmin();
    }catch(e){ toast("Ошибка: " + e.message); }
  });
}

function renderLessonTab(body, active){
  const individuals = active.filter(s=>s.mode === "individual");
  const groupButtons = Object.entries(adminData.groups).map(([key,label])=>`
    <button class="group-btn" data-group="${key}" style="margin-bottom:8px;">👥 Группа ${label}</button>
  `).join("");

  body.innerHTML = `
    <div class="card solid">
      <div class="hint" style="margin-bottom:8px;">Группа — спишет урок у всех участников сразу</div>
      ${groupButtons || '<div class="hint">Групп пока нет</div>'}
    </div>
    <h2>Индивидуальные ученики</h2>
    <div class="card solid">
      ${individuals.length ? individuals.map(s=>`
        <div class="student-row" data-uid="${s.id}">
          <div>
            <div class="student-name">${s.name}</div>
            <div class="student-sub">баланс ${balStr(s)}</div>
          </div>
          <button class="small">−1 урок</button>
        </div>
      `).join("") : '<div class="hint">Нет индивидуальных учеников</div>'}
    </div>
  `;

  body.querySelectorAll(".group-btn").forEach(btn=>{
    btn.addEventListener("click", async ()=>{
      if (!confirm(`Списать урок у всей группы «${btn.textContent.trim()}»?`)) return;
      try{
        const res = await api("/api/lesson", {method:"POST", body: JSON.stringify({kind:"group", group: btn.dataset.group})});
        toast(`Списано у ${res.updated.length} чел.`);
        await refreshAdmin();
      }catch(e){ toast("Ошибка: " + e.message); }
    });
  });

  body.querySelectorAll(".student-row").forEach(row=>{
    row.addEventListener("click", async ()=>{
      const uid = row.dataset.uid;
      const s = adminData.students.find(x=>x.id===uid);
      if (!confirm(`Отметить занятие у ${s.name}?`)) return;
      try{
        await api("/api/lesson", {method:"POST", body: JSON.stringify({kind:"individual", uid})});
        toast("Занятие отмечено ✅");
        await refreshAdmin();
      }catch(e){ toast("Ошибка: " + e.message); }
    });
  });
}

function renderRemindTab(body, active){
  const withPrice = active.filter(s=>s.price != null);
  body.innerHTML = `
    <div class="card solid">
      ${withPrice.length ? withPrice.map(s=>`
        <div class="student-row" data-uid="${s.id}">
          <div>
            <div class="student-name">${s.name}</div>
            <div class="student-sub">цена ${priceStr(s)} · баланс ${balStr(s)}</div>
          </div>
          <div class="hint">→</div>
        </div>
      `).join("") : '<div class="hint">Нет учеников с заданной ценой</div>'}
    </div>
  `;
  body.querySelectorAll(".student-row").forEach(row=>{
    row.addEventListener("click", ()=> openRemindSheet(row.dataset.uid));
  });
}

function openRemindSheet(uid){
  const s = adminData.students.find(x=>x.id===uid);
  if (!s) return;
  const overlay = document.createElement("div");
  overlay.className = "overlay";
  overlay.innerHTML = `
    <div class="sheet">
      <div class="sheet-close"></div>
      <h2 style="margin-top:0">${s.name}</h2>
      <div class="hint">Цена урока: ${s.price}₽</div>
      <div class="card" style="margin-top:12px;">
        <div class="hint">Сколько уроков нужно оплатить?</div>
        <input type="number" id="lessonsInput" placeholder="например 2" min="1">
        <div id="amountPreview" class="hint" style="margin-top:6px;"></div>
        <button id="btnSend" style="margin-top:10px;">Отправить напоминание</button>
      </div>
      <button class="secondary" id="btnClose" style="margin-top:10px;">Отмена</button>
    </div>
  `;
  document.body.appendChild(overlay);
  overlay.addEventListener("click", (e)=>{ if (e.target === overlay) overlay.remove(); });
  overlay.querySelector("#btnClose").addEventListener("click", ()=>overlay.remove());

  const input = overlay.querySelector("#lessonsInput");
  const preview = overlay.querySelector("#amountPreview");
  input.addEventListener("input", ()=>{
    const n = parseInt(input.value, 10);
    preview.textContent = (n>0) ? `К оплате: ${n * s.price}₽` : "";
  });

  overlay.querySelector("#btnSend").addEventListener("click", async ()=>{
    const n = parseInt(input.value, 10);
    if (!(n>0)){ toast("Введи число больше нуля"); return; }
    try{
      const res = await api("/api/remind", {method:"POST", body: JSON.stringify({uid, lessons:n})});
      toast(`Отправлено: ${n} ${wordLessons(n)} — ${res.amount}₽`);
      overlay.remove();
      await refreshAdmin();
    }catch(e){ toast("Ошибка: " + e.message); }
  });
}

function renderConfirmTab(body, awaiting){
  if (!awaiting.length){ body.innerHTML = `<div class="card">Никто не ждёт подтверждения 🎉</div>`; return; }
  body.innerHTML = awaiting.map(s=>{
    if (s.pending_lessons){
      const amount = s.pending_lessons * (s.price||0);
      return `
        <div class="card solid">
          <div class="student-name">${s.name}</div>
          <div class="hint">${s.pending_lessons} ${wordLessons(s.pending_lessons)} — ${amount}₽</div>
          <button data-uid="${s.id}" class="confirm-known" style="margin-top:8px;">✅ Подтвердить</button>
        </div>`;
    }
    return `
      <div class="card solid">
        <div class="student-name">${s.name}</div>
        <div class="hint">Оплатил(а) без напоминания — введи сумму</div>
        <input type="number" class="amount-input" placeholder="сумма в ₽" data-uid="${s.id}">
        <button data-uid="${s.id}" class="confirm-amount" style="margin-top:6px;">Посчитать и подтвердить</button>
      </div>`;
  }).join("");

  body.querySelectorAll(".confirm-known").forEach(btn=>{
    btn.addEventListener("click", async ()=>{
      try{
        const res = await api("/api/confirm", {method:"POST", body: JSON.stringify({uid: btn.dataset.uid})});
        toast(`Оплата подтверждена, +${res.lessons} ${wordLessons(res.lessons)}`);
        await refreshAdmin();
      }catch(e){ toast("Ошибка: " + e.message); }
    });
  });
  body.querySelectorAll(".confirm-amount").forEach(btn=>{
    btn.addEventListener("click", async ()=>{
      const uid = btn.dataset.uid;
      const input = body.querySelector(`.amount-input[data-uid="${uid}"]`);
      const amount = parseInt(input.value, 10);
      if (!(amount>0)){ toast("Введи сумму"); return; }
      try{
        const res = await api("/api/confirm", {method:"POST", body: JSON.stringify({uid, amount})});
        toast(`Оплата подтверждена, +${res.lessons} ${wordLessons(res.lessons)}`);
        await refreshAdmin();
      }catch(e){ toast("Ошибка: " + e.message); }
    });
  });
}

function renderRemovedTab(body, inactive){
  if (!inactive.length){ body.innerHTML = `<div class="card">Удалённых учеников нет.</div>`; return; }
  body.innerHTML = `<div class="card solid">` + inactive.map(s=>`
    <div class="student-row" data-uid="${s.id}">
      <div>
        <div class="student-name">${s.name}</div>
        <div class="student-sub">${modeLabel(s, adminData.groups)}</div>
      </div>
      <button class="small reactivate-btn" data-uid="${s.id}">♻️ Вернуть</button>
    </div>
  `).join("") + `</div>`;

  body.querySelectorAll(".reactivate-btn").forEach(btn=>{
    btn.addEventListener("click", async (e)=>{
      e.stopPropagation();
      try{
        await api("/api/manage", {method:"POST", body: JSON.stringify({uid: btn.dataset.uid, action:"reactivate"})});
        toast("Реактивирован(а) ✅");
        await refreshAdmin();
      }catch(err){ toast("Ошибка: " + err.message); }
    });
  });
}

async function refreshAdmin(){
  await loadAdminData();
  renderAdmin();
}

// ================= ЗАГРУЗКА =================
async function load(){
  try{
    const me = await api("/api/me");
    if (me.is_admin){
      await loadAdminData();
      renderAdmin();
      return;
    }
    if (!me.registered){ renderNotRegistered(); return; }
    if (me.price == null || me.balance == null){ renderNotSetup(me); return; }
    renderStudent(me);
  }catch(e){
    app.innerHTML = `<div class="card">Не удалось загрузить данные: ${e.message}</div>`;
  }
}

load();
</script>
</body>
</html>
