<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Абонементы</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  /* палитра с фотографий: кремово-бежевый + бирюзовый акцент */
  --cream:#E4E1D7;
  --bg:#E4E1D7;
  --card:#F3F1E8;
  --card-solid:#FBFAF5;
  --teal:#77C6C7;
  --teal-dark:#4E9FA0;
  --text:#2E2E29;
  --hint:#8B897C;
  --line:rgba(46,46,41,.12);
  --soft:rgba(119,198,199,.16);
  --ok:#6FA88A;
  --warn:#C9962E;
  --bad:#B8573F;
  --accent-text:#20302F;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0; padding:0; background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  font-size:15px; line-height:1.4;}
body{padding-bottom:24px;}
.wrap{max-width:520px; margin:0 auto; padding:16px;}
h1{font-size:20px; margin:4px 0 2px;}
h2{font-size:16px; margin:18px 0 8px; color:var(--text);}
.hint{color:var(--hint); font-size:13px;}

.card{background:var(--card); border:1px solid var(--line); border-radius:16px;
  padding:16px; margin-bottom:12px;}
.card.solid{background:var(--card-solid);}

.balance-card{border-radius:18px; padding:20px; margin:12px 0; color:var(--accent-text);}
.balance-card.ok{background:linear-gradient(135deg,#BFE3D8,#9FD0C6);}
.balance-card.warn{background:linear-gradient(135deg,#F3DFA0,#EBC873);}
.balance-card.bad{background:linear-gradient(135deg,#E9BDB0,#DE9A87);}
.balance-num{font-size:34px; font-weight:700; margin:4px 0;}
.balance-label{font-size:13px; opacity:.75;}

.row{display:flex; align-items:center; justify-content:space-between; gap:10px;}
.row + .row{margin-top:8px;}

button, .btn{
  font-family:inherit; font-size:15px; font-weight:600;
  border:none; border-radius:12px; padding:12px 16px;
  background:var(--teal); color:#1B2B2A; cursor:pointer;
  width:100%; text-align:center;
}
button:active{background:var(--teal-dark);}
button.secondary{background:var(--card-solid); color:var(--text); border:1px solid var(--line);}
button.danger{background:var(--bad); color:#fff;}
button.small{width:auto; padding:8px 12px; font-size:13px; border-radius:10px;}
button:disabled{opacity:.5; cursor:default;}

input[type=text], input[type=number]{
  width:100%; font-size:15px; font-family:inherit; color:var(--text);
  background:var(--card-solid); border:1px solid var(--line); border-radius:10px;
  padding:10px 12px; margin:6px 0;
}

.copy-row{display:flex; align-items:center; justify-content:space-between; gap:8px;
  background:var(--card-solid); border:1px solid var(--line); border-radius:10px;
  padding:8px 10px; margin-top:4px;}
.card-number{font-weight:700; font-size:15px; letter-spacing:.3px;}
.copy-btn{width:auto; flex:none; padding:6px 10px; font-size:12px; font-weight:600;
  background:var(--teal); color:var(--accent-text); border-radius:8px;}

.tabs{display:flex; gap:6px; overflow-x:auto; margin:14px 0; padding-bottom:4px;}
.tab{flex:none; padding:8px 14px; border-radius:999px; background:var(--card);
  border:1px solid var(--line); color:var(--hint); font-size:13px; font-weight:600; cursor:pointer;}
.tab.active{background:var(--teal); color:var(--accent-text); border-color:transparent;}

.student-row{display:flex; justify-content:space-between; align-items:center;
  padding:12px 0; border-bottom:1px solid var(--line); cursor:pointer;}
.student-row:last-child{border-bottom:none;}
.student-name{font-weight:600;}
.student-sub{font-size:12px; color:var(--hint);}
.badge{font-size:11px; padding:2px 8px; border-radius:999px; font-weight:700;}
.badge.ok{background:var(--soft); color:var(--teal-dark);}
.badge.warn{background:#F3DFA0; color:#7A5A0E;}
.badge.bad{background:#EAC3B7; color:#8A3A24;}
.badge.paused{background:var(--line); color:var(--hint);}

.overlay{position:fixed; inset:0; background:rgba(46,46,41,.35);
  display:flex; align-items:flex-end; justify-content:center; z-index:50;}
.sheet{background:var(--bg); width:100%; max-width:520px; border-radius:20px 20px 0 0;
  padding:20px; max-height:85vh; overflow-y:auto;}
.sheet-close{width:36px; height:4px; background:var(--line); border-radius:99px; margin:0 auto 14px;}

.spinner{width:28px; height:28px; border-radius:50%; border:3px solid var(--line);
  border-top-color:var(--teal); animation:spin .8s linear infinite; margin:60px auto;}
@keyframes spin{to{transform:rotate(360deg);}}

.toast{position:fixed; left:50%; bottom:24px; transform:translateX(-50%);
  background:var(--text); color:var(--bg); padding:10px 18px; border-radius:99px;
  font-size:13px; z-index:100; opacity:0; transition:opacity .25s;}
.toast.show{opacity:1;}

.card-title{font-weight:700; font-size:14px; margin-bottom:6px;}
.badges{display:flex; flex-direction:column; gap:4px; align-items:flex-end;}
.enroll-editor{margin-top:12px;}
</style>
</head>
<body>

<div class="wrap" id="app">
  <div class="spinner"></div>
</div>
<div class="toast" id="toast"></div>

<script>
const tg = window.Telegram?.WebApp;
if (tg){ tg.ready(); tg.expand(); }
const initData = tg?.initData || "";

const app = document.getElementById("app");
const toastEl = document.getElementById("toast");

function toast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add("show");
  setTimeout(()=>toastEl.classList.remove("show"), 2200);
}

// Всё, что пришло от пользователей (имена), экранируем перед вставкой в HTML
function esc(s){
  return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

async function api(path, opts={}){
  const headers = Object.assign({"X-Telegram-Init-Data": initData}, opts.headers||{});
  if (opts.body) headers["Content-Type"] = "application/json";
  const res = await fetch(path, Object.assign({}, opts, {headers}));
  let data = {};
  try { data = await res.json(); } catch(e){}
  if (!res.ok) throw new Error(data.error || ("HTTP " + res.status));
  return data;
}
const post = (path, body) => api(path, {method:"POST", body: JSON.stringify(body)});

function wordLessons(n){
  const a = Math.abs(n);
  if (a % 100 >= 11 && a % 100 <= 14) return "уроков";
  const d = a % 10;
  if (d === 1) return "урок";
  if (d >= 2 && d <= 4) return "урока";
  return "уроков";
}
function balanceClass(balance){
  if (balance > 1) return "ok";
  if (balance === 0 || balance === 1) return "warn";
  return "bad";
}
const badgeClass = balanceClass;

function openSheet(html){
  const overlay = document.createElement("div");
  overlay.className = "overlay";
  overlay.innerHTML = `<div class="sheet"><div class="sheet-close"></div>${html}</div>`;
  document.body.appendChild(overlay);
  overlay.addEventListener("click", (e)=>{ if (e.target === overlay) overlay.remove(); });
  return overlay;
}

// ---------- реквизиты с копированием ----------
function cardBlock(cardNumber){
  return `
    <div class="card-title">Реквизиты для оплаты</div>
    <div class="copy-row">
      <span class="card-number">${esc(cardNumber)}</span>
      <button class="copy-btn" data-copy="${esc(cardNumber)}">📋 Скопировать</button>
    </div>`;
}

function attachCopyHandlers(root){
  root.querySelectorAll(".copy-btn").forEach(btn=>{
    btn.addEventListener("click", async ()=>{
      const text = btn.dataset.copy;
      try{
        await navigator.clipboard.writeText(text);
        toast("Скопировано ✅");
      }catch(e){
        const ta = document.createElement("textarea");
        ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
        document.body.appendChild(ta); ta.focus(); ta.select();
        try{ document.execCommand("copy"); toast("Скопировано ✅"); }
        catch(e2){ toast("Не удалось скопировать"); }
        ta.remove();
      }
    });
  });
}

// ================= УЧЕНИК =================
function enrollCard(e){
  if (e.price == null || e.balance == null){
    return `<div class="card"><div class="student-name">${esc(e.label)}</div>
      <div class="hint">Виктория ещё настраивает этот абонемент</div></div>`;
  }
  return `
    <div class="balance-card ${balanceClass(e.balance)}">
      <div class="balance-label" style="font-weight:700;">${esc(e.label)}</div>
      <div class="balance-label" style="margin-top:6px;">Баланс уроков</div>
      <div class="balance-num">${e.balance} ${wordLessons(e.balance)}</div>
      <div class="balance-label">${e.price}₽ / урок</div>
    </div>`;
}

function renderStudent(me){
  const ready = me.enrollments.filter(e => e.price != null);

  // Реквизиты: при активном напоминании, а также когда по какой-то подписке
  // баланс положительный (можно оплатить заранее). Если везде 0 или минус
  // и напоминаний нет — блок не показываем.
  const showCard = me.card_number && ready.some(e => e.pending_lessons || (e.balance ?? 0) > 0);
  const paymentBlock = showCard ? `<div class="card">${cardBlock(me.card_number)}</div>` : "";

  let banner = "";
  if (!me.active) banner = `<div class="card">Твой аккаунт неактивен. Напиши Виктории.</div>`;
  else if (me.paused) banner = `<div class="card">Занятия сейчас на паузе.</div>`;

  const awaiting = me.enrollments.some(e => e.awaiting_confirmation);
  const confirmBadge = awaiting ? `<div class="hint" style="margin-top:6px;">⏳ Ждём подтверждения Виктории</div>` : "";

  app.innerHTML = `
    <h1>Привет, ${esc(me.name)}! 👋</h1>
    ${banner}
    ${me.enrollments.map(enrollCard).join("")}
    ${paymentBlock}
    ${confirmBadge}
    <button id="btnPaid" ${ready.length ? "" : "disabled"}>Я оплатил(а)</button>
  `;
  attachCopyHandlers(app);

  document.getElementById("btnPaid")?.addEventListener("click", ()=>{
    if (ready.length === 1) paidFor(ready[0], ready.length);
    else openChooseEnrollmentSheet(ready);
  });
}

function openChooseEnrollmentSheet(ready){
  const overlay = openSheet(`
    <h2 style="margin-top:0">За какие занятия оплата?</h2>
    ${ready.map(e => `<button class="secondary choose-btn" data-key="${esc(e.key)}" style="margin-bottom:8px;">${esc(e.label)}</button>`).join("")}
    <button class="secondary" id="btnCancelChoose" style="margin-top:6px;">Отмена</button>
  `);
  overlay.querySelector("#btnCancelChoose").addEventListener("click", ()=>overlay.remove());
  overlay.querySelectorAll(".choose-btn").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      overlay.remove();
      paidFor(ready.find(e => e.key === btn.dataset.key), ready.length);
    });
  });
}

async function paidFor(e, totalReady){
  if (e.pending_lessons){
    try{
      await post("/api/paid", {key: e.key});
      toast("Спасибо! Отправили Виктории на подтверждение 🙌");
      load();
    }catch(err){ toast("Не получилось: " + err.message); }
  } else {
    openReportLessonsSheet(e, totalReady);
  }
}

function openReportLessonsSheet(e, totalReady){
  const overlay = openSheet(`
    <h2 style="margin-top:0">Сколько уроков ты оплатил(а)?</h2>
    ${totalReady > 1 ? `<div class="hint">${esc(e.label)}</div>` : ""}
    <div class="card" style="margin-top:10px;">
      <input type="number" id="lessonsPaidInput" placeholder="например 2" min="1">
      <button id="btnSubmitLessons" style="margin-top:8px;">Отправить</button>
    </div>
    <button class="secondary" id="btnCancelReport" style="margin-top:10px;">Отмена</button>
  `);
  overlay.querySelector("#btnCancelReport").addEventListener("click", ()=>overlay.remove());
  overlay.querySelector("#btnSubmitLessons").addEventListener("click", async ()=>{
    const n = parseInt(overlay.querySelector("#lessonsPaidInput").value, 10);
    if (!(n > 0)){ toast("Введи число больше нуля"); return; }
    try{
      await post("/api/paid", {key: e.key, lessons: n});
      toast("Спасибо! Отправили Виктории на подтверждение 🙌");
      overlay.remove();
      load();
    }catch(err){ toast("Не получилось: " + err.message); }
  });
}

function renderNotRegistered(){
  app.innerHTML = `
    <h1>Привет!</h1>
    <div class="card">Похоже, ты ещё не зарегистрирован(а). Напиши боту /start в чате, чтобы зарегистрироваться, потом возвращайся сюда.</div>
  `;
}

// ================= ПРЕПОДАВАТЕЛЬ =================
let adminData = { students: [], keys: [], labels: {} };
let activeTab = "students";

const shortLabel = (key) => key === "individual" ? "Инд." : (adminData.labels[key] || key);
const priceStr = (e) => e.price != null ? `${e.price}₽` : "—";
const balStr = (e) => e.balance != null ? `${e.balance} ${wordLessons(e.balance)}` : "—";

function enrollList(s){
  const enr = s.enrollments || {};
  return adminData.keys.filter(k => enr[k]).map(k => ({key: k, ...enr[k]}));
}

async function loadAdminData(){
  adminData = await api("/api/students");
}
async function refreshAdmin(){
  await loadAdminData();
  renderAdmin();
}

function renderAdmin(){
  const active = adminData.students.filter(s => s.active);
  const inactive = adminData.students.filter(s => !s.active);
  const awaitingCount = active.reduce((sum, s) =>
    sum + enrollList(s).filter(e => e.awaiting_confirmation && e.pending_lessons).length, 0);

  app.innerHTML = `
    <h1>Преподаватель Виктория</h1>
    <div class="tabs">
      <div class="tab ${activeTab==='students'?'active':''}" data-tab="students">👥 Ученики</div>
      <div class="tab ${activeTab==='lesson'?'active':''}" data-tab="lesson">📚 Урок</div>
      <div class="tab ${activeTab==='remind'?'active':''}" data-tab="remind">🔔 Напомнить</div>
      <div class="tab ${activeTab==='confirm'?'active':''}" data-tab="confirm">✅ Подтвердить${awaitingCount?` (${awaitingCount})`:''}</div>
      <div class="tab ${activeTab==='removed'?'active':''}" data-tab="removed">🗄 Удалённые</div>
    </div>
    <div id="tabBody"></div>
  `;
  document.querySelectorAll(".tab").forEach(t=>{
    t.addEventListener("click", ()=>{ activeTab = t.dataset.tab; renderAdmin(); });
  });

  const body = document.getElementById("tabBody");
  if (activeTab === "students") renderStudentsTab(body, active);
  else if (activeTab === "lesson") renderLessonTab(body, active);
  else if (activeTab === "remind") renderRemindTab(body, active);
  else if (activeTab === "confirm") renderConfirmTab(body, active);
  else if (activeTab === "removed") renderRemovedTab(body, inactive);
}

// ---------- Ученики ----------
function renderStudentsTab(body, active){
  if (!active.length){ body.innerHTML = `<div class="card">Учеников пока нет.</div>`; return; }
  body.innerHTML = `<div class="card solid">` + active.map(s => {
    const list = enrollList(s);
    return `
      <div class="student-row" data-uid="${esc(s.id)}">
        <div>
          <div class="student-name">${esc(s.name)} ${s.paused ? "⏸" : ""}</div>
          <div class="student-sub">${list.map(e => `${esc(shortLabel(e.key))} · ${priceStr(e)}`).join(" | ") || "нет занятий"}</div>
        </div>
        <div class="badges">
          ${list.map(e => `<div class="badge ${badgeClass(e.balance ?? 0)}">${esc(shortLabel(e.key))}: ${e.balance != null ? e.balance : "—"}</div>`).join("")}
        </div>
      </div>`;
  }).join("") + `</div>`;

  body.querySelectorAll(".student-row").forEach(row=>{
    row.addEventListener("click", ()=> openStudentSheet(row.dataset.uid));
  });
}

function openStudentSheet(uid){
  const s = adminData.students.find(x => x.id === uid);
  if (!s) return;
  const enr = s.enrollments || {};

  const blocks = adminData.keys.map(key => {
    const e = enr[key];
    const label = esc(adminData.labels[key] || key);
    if (e){
      return `
        <div class="card enroll-editor" data-key="${esc(key)}">
          <div class="student-name">${label}</div>
          <div class="hint">Цена урока (₽)</div>
          <input type="number" class="f-price" value="${e.price ?? ""}" placeholder="например 3000">
          <div class="hint">Баланс уроков (может быть отрицательным)</div>
          <input type="number" class="f-balance" value="${e.balance ?? ""}" placeholder="например 0 или -1">
          <button class="save-enroll" style="margin-top:8px;">💾 Сохранить</button>
        </div>`;
    }
    return `
      <div class="card enroll-editor" data-key="${esc(key)}" data-new="1">
        <div class="student-name">➕ Добавить в занятия: ${label}</div>
        <div class="hint">Цена урока (₽)</div>
        <input type="number" class="f-price" placeholder="например 3000">
        <div class="hint">Стартовый баланс уроков</div>
        <input type="number" class="f-balance" placeholder="например 0">
        <button class="save-enroll" style="margin-top:8px;">➕ Добавить</button>
      </div>`;
  }).join("");

  const overlay = openSheet(`
    <h2 style="margin-top:0">${esc(s.name)}</h2>
    ${blocks}
    <div class="row" style="margin-top:6px;">
      <button class="secondary" id="btnPause">${s.paused ? "▶️ Снять с паузы" : "⏸ Поставить на паузу"}</button>
    </div>
    <div class="row" style="margin-top:8px;"><button class="danger" id="btnRemove">🗑 Удалить ученика</button></div>
    <div class="row" style="margin-top:14px;"><button class="secondary" id="btnClose">Закрыть</button></div>
  `);
  overlay.querySelector("#btnClose").addEventListener("click", ()=>overlay.remove());

  overlay.querySelectorAll(".save-enroll").forEach(btn=>{
    btn.addEventListener("click", async ()=>{
      const box = btn.closest(".enroll-editor");
      const key = box.dataset.key;
      const isNew = box.dataset.new === "1";
      const price = box.querySelector(".f-price").value;
      const balance = box.querySelector(".f-balance").value;
      if (isNew && (price === "" || balance === "")){ toast("Укажи цену урока и стартовый баланс"); return; }
      try{
        await post("/api/setup", {
          uid, key,
          price: price !== "" ? parseInt(price, 10) : null,
          balance: balance !== "" ? parseInt(balance, 10) : null,
        });
        toast(isNew ? "Добавлено ✅" : "Сохранено ✅");
        overlay.remove();
        await refreshAdmin();
      }catch(e){ toast("Ошибка: " + e.message); }
    });
  });

  overlay.querySelector("#btnPause").addEventListener("click", async ()=>{
    try{ await post("/api/manage", {uid, action:"toggle_pause"}); overlay.remove(); await refreshAdmin(); }
    catch(e){ toast("Ошибка: " + e.message); }
  });
  overlay.querySelector("#btnRemove").addEventListener("click", async ()=>{
    if (!confirm(`Удалить ${s.name}?`)) return;
    try{ await post("/api/manage", {uid, action:"remove"}); overlay.remove(); await refreshAdmin(); }
    catch(e){ toast("Ошибка: " + e.message); }
  });
}

// ---------- Урок ----------
function renderLessonTab(body, active){
  const present = active.filter(s => !s.paused);
  const groupKeys = adminData.keys.filter(k => k !== "individual");

  const groupButtons = groupKeys.map(key => {
    const n = present.filter(s => (s.enrollments || {})[key]).length;
    return `<button class="group-btn" data-group="${esc(key)}" style="margin-bottom:8px;">👥 Группа ${esc(adminData.labels[key])} (${n})</button>`;
  }).join("");

  const individuals = present.filter(s => (s.enrollments || {}).individual);

  body.innerHTML = `
    <div class="card solid">
      <div class="hint" style="margin-bottom:8px;">Группа — спишет урок у всех участников сразу</div>
      ${groupButtons || '<div class="hint">Групп пока нет</div>'}
    </div>
    <h2>Индивидуальные ученики</h2>
    <div class="card solid">
      ${individuals.length ? individuals.map(s => `
        <div class="student-row" data-uid="${esc(s.id)}">
          <div>
            <div class="student-name">${esc(s.name)}</div>
            <div class="student-sub">баланс ${balStr(s.enrollments.individual)}</div>
          </div>
          <button class="small">−1 урок</button>
        </div>`).join("") : '<div class="hint">Нет индивидуальных учеников</div>'}
    </div>
  `;

  body.querySelectorAll(".group-btn").forEach(btn=>{
    btn.addEventListener("click", async ()=>{
      const group = btn.dataset.group;
      if (!confirm(`Списать урок у всей группы «${adminData.labels[group]}»?`)) return;
      try{
        const res = await post("/api/lesson", {kind:"group", group});
        toast(`Списано у ${res.updated.length} чел.`);
        await refreshAdmin();
      }catch(e){ toast("Ошибка: " + e.message); }
    });
  });

  body.querySelectorAll(".student-row").forEach(row=>{
    row.addEventListener("click", async ()=>{
      const uid = row.dataset.uid;
      const s = adminData.students.find(x => x.id === uid);
      if (!confirm(`Отметить занятие у ${s.name}?`)) return;
      try{
        await post("/api/lesson", {kind:"individual", uid});
        toast("Занятие отмечено ✅");
        await refreshAdmin();
      }catch(e){ toast("Ошибка: " + e.message); }
    });
  });
}

// ---------- Напомнить ----------
function renderRemindTab(body, active){
  const entries = [];
  active.filter(s => !s.paused).forEach(s => {
    enrollList(s).forEach(e => { if (e.price != null) entries.push({s, e}); });
  });
  body.innerHTML = `
    <div class="card solid">
      ${entries.length ? entries.map(({s, e}) => `
        <div class="student-row" data-uid="${esc(s.id)}" data-key="${esc(e.key)}">
          <div>
            <div class="student-name">${esc(s.name)}</div>
            <div class="student-sub">${esc(shortLabel(e.key))} · цена ${priceStr(e)} · баланс ${balStr(e)}</div>
          </div>
          <div class="hint">→</div>
        </div>`).join("") : '<div class="hint">Нет учеников с заданной ценой</div>'}
    </div>
  `;
  body.querySelectorAll(".student-row").forEach(row=>{
    row.addEventListener("click", ()=> openRemindSheet(row.dataset.uid, row.dataset.key));
  });
}

function openRemindSheet(uid, key){
  const s = adminData.students.find(x => x.id === uid);
  const e = s && (s.enrollments || {})[key];
  if (!e) return;
  const overlay = openSheet(`
    <h2 style="margin-top:0">${esc(s.name)}</h2>
    <div class="hint">${esc(adminData.labels[key])} · цена урока ${e.price}₽</div>
    <div class="card" style="margin-top:12px;">
      <div class="hint">Сколько уроков нужно оплатить?</div>
      <input type="number" id="lessonsInput" placeholder="например 2" min="1">
      <div id="amountPreview" class="hint" style="margin-top:6px;"></div>
      <button id="btnSend" style="margin-top:10px;">Отправить напоминание</button>
    </div>
    <button class="secondary" id="btnClose" style="margin-top:10px;">Отмена</button>
  `);
  overlay.querySelector("#btnClose").addEventListener("click", ()=>overlay.remove());

  const input = overlay.querySelector("#lessonsInput");
  const preview = overlay.querySelector("#amountPreview");
  input.addEventListener("input", ()=>{
    const n = parseInt(input.value, 10);
    preview.textContent = (n > 0) ? `К оплате: ${n * e.price}₽` : "";
  });

  overlay.querySelector("#btnSend").addEventListener("click", async ()=>{
    const n = parseInt(input.value, 10);
    if (!(n > 0)){ toast("Введи число больше нуля"); return; }
    try{
      const res = await post("/api/remind", {uid, key, lessons: n});
      toast(`Отправлено: ${n} ${wordLessons(n)} — ${res.amount}₽`);
      overlay.remove();
      await refreshAdmin();
    }catch(err){ toast("Ошибка: " + err.message); }
  });
}

// ---------- Подтвердить ----------
function renderConfirmTab(body, active){
  const entries = [];
  active.forEach(s => {
    enrollList(s).forEach(e => { if (e.awaiting_confirmation && e.pending_lessons) entries.push({s, e}); });
  });
  if (!entries.length){ body.innerHTML = `<div class="card">Никто не ждёт подтверждения 🎉</div>`; return; }

  body.innerHTML = entries.map(({s, e}) => {
    const amount = e.pending_lessons * (e.price || 0);
    return `
      <div class="card solid">
        <div class="student-name">${esc(s.name)}</div>
        <div class="hint">${esc(adminData.labels[e.key])}</div>
        <div class="hint">${e.pending_lessons} ${wordLessons(e.pending_lessons)} — ${amount}₽</div>
        <button class="confirm-btn" data-uid="${esc(s.id)}" data-key="${esc(e.key)}" style="margin-top:8px;">✅ Подтвердить</button>
      </div>`;
  }).join("");

  body.querySelectorAll(".confirm-btn").forEach(btn=>{
    btn.addEventListener("click", async ()=>{
      try{
        const res = await post("/api/confirm", {uid: btn.dataset.uid, key: btn.dataset.key});
        toast(`Оплата подтверждена, +${res.lessons} ${wordLessons(res.lessons)}`);
        await refreshAdmin();
      }catch(err){ toast("Ошибка: " + err.message); }
    });
  });
}

// ---------- Удалённые ----------
function renderRemovedTab(body, inactive){
  if (!inactive.length){ body.innerHTML = `<div class="card">Удалённых учеников нет.</div>`; return; }
  body.innerHTML = `<div class="card solid">` + inactive.map(s => `
    <div class="student-row">
      <div>
        <div class="student-name">${esc(s.name)}</div>
        <div class="student-sub">${enrollList(s).map(e => esc(shortLabel(e.key))).join(" + ")}</div>
      </div>
      <button class="small reactivate-btn" data-uid="${esc(s.id)}">♻️ Вернуть</button>
    </div>`).join("") + `</div>`;

  body.querySelectorAll(".reactivate-btn").forEach(btn=>{
    btn.addEventListener("click", async ()=>{
      try{
        await post("/api/manage", {uid: btn.dataset.uid, action:"reactivate"});
        toast("Реактивирован(а) ✅");
        await refreshAdmin();
      }catch(err){ toast("Ошибка: " + err.message); }
    });
  });
}

// ================= ЗАГРУЗКА =================
async function load(){
  try{
    const me = await api("/api/me");
    if (me.is_admin){
      await loadAdminData();
      renderAdmin();
      return;
    }
    if (!me.registered){ renderNotRegistered(); return; }
    renderStudent(me);
  }catch(e){
    app.innerHTML = `<div class="card">Не удалось загрузить данные: ${esc(e.message)}</div>`;
  }
}

load();
</script>
</body>
</html>
